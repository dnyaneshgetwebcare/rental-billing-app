; Local stand-in for GoDaddy cPanel → MultiPHP INI Editor.
; Per-directory overrides: put a .user.ini in public_html (same as GoDaddy).

memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000
post_max_size = 64M
upload_max_filesize = 64M

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL

date.timezone = UTC
expose_php = Off
allow_url_fopen = On
short_open_tag = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
